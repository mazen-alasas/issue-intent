[project]
name = "issue-intent"
version = "0.1.0"
description = "NLP system for classifying GitHub issues by intent."
readme = "README.md"
authors = [
    { name = "mazen-Ubuntu", email = "alasasmazen665@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
